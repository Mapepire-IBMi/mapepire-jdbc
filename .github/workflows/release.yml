name: Maven Release

on:
  workflow_dispatch:
  release:
    types: [created]

env:
  CONFIG_PROPERTIES: ./src/test/resources/config.properties
  CONFIG_PROPERTIES_SAMPLE: ./src/test/resources/config.properties.sample

jobs:
  release:

    runs-on: ubuntu-latest

    environment: OSSBUILD

    env:
      IBMI_HOST: ${{ secrets.IBMI_HOST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Maven Project Version
        run: |
          echo "PROJECT_VERSION=$(mvn -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive exec:exec --file pom.xml)" >> $GITHUB_ENV
          cat $GITHUB_ENV

      - name: Install GPG Secret Key
        id: install-secret-key
        run: |
          cat <(echo -e "${{ secrets.GPG_SECRET_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Install GPG Public Key
        id: install-public-key
        run: |
          cat <(echo -e "${{ secrets.GPG_PUBLIC_KEY }}") | gpg --batch --import
          gpg --list-public-keys --keyid-format LONG

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          gpg-passphrase: GPG_PASSPHRASE
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set Test Secrets
        if: contains(env.IBMI_HOST, '.')
        run: |
          cp ${{ env.CONFIG_PROPERTIES_SAMPLE }} ${{ env.CONFIG_PROPERTIES }}
          sed -i "s/^IBMI_HOST=/IBMI_HOST=$IBMI_HOST/" ${{ env.CONFIG_PROPERTIES }}
          sed -i "s/^IBMI_USER=/IBMI_USER=$IBMI_USER/" ${{ env.CONFIG_PROPERTIES }}
          sed -i "s/^IBMI_PASSWORD=/IBMI_PASSWORD=$IBMI_PASSWORD/" ${{ env.CONFIG_PROPERTIES }}
          sed -i "s/^IBMI_PORT=/IBMI_PORT=$IBMI_PORT/" ${{ env.CONFIG_PROPERTIES }}
        env:
          IBMI_HOST: ${{ secrets.IBMI_HOST }}
          IBMI_USER: ${{ secrets.IBMI_USER }}
          IBMI_PASSWORD: ${{ secrets.IBMI_PASSWORD }}
          IBMI_PORT: ${{ secrets.IBMI_PORT }}

      - name: Eyeball settings.xml
        run: cat $HOME/.m2/settings.xml

      - name: Publish Maven Package
        run: mvn --batch-mode clean deploy --file pom.xml
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: List Target Directory
        run: ls -l target

      - name: Copy Artifacts to Staging Directory
        run: mkdir staging && cp target/*.jar staging

      - name: Create Bundle .zip and move main jar file
        run: |
          cd staging
          zip ../mapepire-jdbc-${{ env.PROJECT_VERSION }}.zip *.jar
          mv ./mapepire-jdbc-${{ env.PROJECT_VERSION }}.jar ..
          cd ..

      - name: Create the tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PROJECT_VERSION }}
          name: v${{ env.PROJECT_VERSION }}
          files: |
            mapepire-jdbc-${{ env.PROJECT_VERSION }}.zip
            mapepire-jdbc-${{ env.PROJECT_VERSION }}.jar
